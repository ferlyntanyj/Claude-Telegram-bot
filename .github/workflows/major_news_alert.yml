name: Global Major News Alert

on:
  schedule:
    # Asks for every 20 minutes, offset 7 min from the hour to dodge the
    # top-of-hour congestion GitHub warns scheduled jobs can be delayed by --
    # but GitHub does NOT actually honor that cadence for this account tier.
    # Personal/low-traffic repos get routed to a low-priority batch queue
    # that in practice sweeps every 2-6+ hours regardless of the cron
    # expression (confirmed empirically: 24 runs over 60 hours, not ~180).
    # This is a documented platform limitation, not fixable from this file.
    # major_news_engine.effective_lookback_hours() compensates by looking
    # back to whenever the last run actually completed rather than assuming
    # 20 minutes, so an irregular gap widens the window instead of silently
    # dropping headlines.
    # NOTE: GitHub often skips the *first* scheduled slot after a workflow is
    # added or the repo is renamed; committing to this file re-arms the cron.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      test_llm:
        description: "Diagnostic only: force one real Groq call to verify GROQ_API_KEY, skip headline fetching/Telegram entirely"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: major-news-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run major news alert
        working-directory: scripts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SGX_SCREENER_TELEGRAM_BOT_TOKEN: ${{ secrets.SGX_SCREENER_TELEGRAM_BOT_TOKEN }}
          SGX_SCREENER_TELEGRAM_CHAT_ID: ${{ secrets.SGX_SCREENER_TELEGRAM_CHAT_ID }}
        run: python major_news_alert.py ${{ inputs.test_llm && '--test-llm' || '' }}

      # data/alert_state.json now changes on every run (it records
      # last_run_utc for the self-healing lookback window, not just cooldown
      # entries), so this commits every cycle -- which doubles as a visible
      # heartbeat: the commit history shows exactly when this last actually
      # ran, useful given GitHub's own scheduling is the unreliable part.
      # data/global_watchlist.csv is refreshed by the separate weekly workflow.
      - name: Commit and push state/log if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Both paths only get written once the first alert ever fires --
          # "git add" hard-fails (exit 128) on a pathspec that matches nothing,
          # which would red-X every quiet cycle before that under Actions'
          # default `bash -e`, so add each only if it exists.
          [ -f data/alert_state.json ] && git add data/alert_state.json
          [ -f output/major_news_alert_log.json ] && git add output/major_news_alert_log.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Major news alert state update: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $attempt failed, retrying..."
              sleep 5
            done
          fi
