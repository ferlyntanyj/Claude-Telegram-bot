name: Weekly Liquidity Momentum Screener

on:
  schedule:
    # 00:00 UTC Monday = 08:00 Asia/Singapore Monday, before SGX opens at 09:00 SGT
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        working-directory: scripts
        run: |
          python 01_get_universe.py
          python 02_fetch_history.py
          python 03_compute_screener.py
          python 04_build_workbook.py
          python 05_weekly_diff.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ history/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly screener run: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Send Telegram message
        working-directory: scripts
        env:
          SGX_SCREENER_TELEGRAM_BOT_TOKEN: ${{ secrets.SGX_SCREENER_TELEGRAM_BOT_TOKEN }}
          SGX_SCREENER_TELEGRAM_CHAT_ID: ${{ secrets.SGX_SCREENER_TELEGRAM_CHAT_ID }}
        run: python send_telegram_message.py
