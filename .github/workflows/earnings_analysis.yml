name: Daily Earnings Analysis

on:
  schedule:
    # 23:00 UTC = 07:00 SGT next day -- catches same-morning SGX/HK/Bursa/
    # Thailand releases plus the prior US trading day's after-hours/
    # pre-market reports, before SGX/HK/Bursa/Thailand markets open.
    # NOTE: GitHub often skips the *first* scheduled slot after a workflow
    # is added; committing to this file re-arms the cron if runs don't
    # start appearing.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: detect newly-reported tickers only, no API calls, no state changes"
        type: boolean
        default: false
      test_ticker:
        description: "Diagnostic: force the full pipeline for one ticker (e.g. NVDA), ignoring dry_run. Prints the report + Telegram-format preview in the log; never touches state.json or Telegram."
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: earnings-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run earnings analysis
        working-directory: scripts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SGX_SCREENER_TELEGRAM_BOT_TOKEN: ${{ secrets.SGX_SCREENER_TELEGRAM_BOT_TOKEN }}
          SGX_SCREENER_TELEGRAM_CHAT_ID: ${{ secrets.SGX_SCREENER_TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ inputs.test_ticker }}" ]; then
            python earnings_analysis.py --test-ticker "${{ inputs.test_ticker }}"
          else
            python earnings_analysis.py ${{ inputs.dry_run && '--dry-run' || '' }}
          fi

      # data/earnings_analysis_state.json changes on every non-dry-run run
      # (last_run_utc, plus any newly-baselined/advanced tickers), and the
      # full reports under output/earnings_analysis/ only exist once a
      # report has actually fired -- commit whichever changed. Doubles as a
      # visible heartbeat in the commit history.
      - name: Commit and push state/output if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f data/earnings_analysis_state.json ] && git add data/earnings_analysis_state.json
          [ -d output/earnings_analysis ] && git add output/earnings_analysis
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Earnings analysis state update: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $attempt failed, retrying..."
              sleep 5
            done
          fi
